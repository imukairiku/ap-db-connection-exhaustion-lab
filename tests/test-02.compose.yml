services:
  db-server:
    build:
      context: ../phase0
      dockerfile: db.Dockerfile
    command: ["postgres", "-c", "max_connections=20"]
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-only
      POSTGRES_DB: lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 1s
      timeout: 2s
      retries: 30
    networks: [test02]

  ap-server-1:
    build:
      context: ../phase1/test02
    environment:
      DB_HOST: db-server
      DB_USER: lab
      DB_PASSWORD: lab-only
      DB_NAME: lab
    depends_on:
      db-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 1s
      timeout: 2s
      retries: 30
    networks: [test02]

networks:
  test02:
    internal: true

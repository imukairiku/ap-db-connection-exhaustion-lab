services:
  db-server:
    build: {context: ../phase0, dockerfile: db.Dockerfile}
    command: ["postgres", "-c", "max_connections=20"]
    environment: {POSTGRES_USER: lab, POSTGRES_PASSWORD: lab-only, POSTGRES_DB: lab}
    volumes: ["../phase2/test06/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U lab -d lab"], interval: 1s, timeout: 2s, retries: 30}
    networks: [test13]
  ap-server-2:
    build: {context: ../phase5/test13}
    environment: {DB_HOST: db-server, REQUEST_ID: "${PHASE5_REQUEST_ID}"}
    depends_on: {db-server: {condition: service_healthy}}
    networks: [test13]
  ap-netadmin-2:
    build: {context: ../phase0, dockerfile: tools.Dockerfile}
    command: ["sleep", "infinity"]
    cap_add: [NET_ADMIN]
    network_mode: "service:ap-server-2"
    depends_on: [ap-server-2]
networks:
  test13: {internal: true}

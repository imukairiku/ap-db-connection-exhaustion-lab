services:
  db:
    build:
      context: .
      dockerfile: db.Dockerfile
    environment:
      POSTGRES_USER: probe
      POSTGRES_PASSWORD: probe-only
      POSTGRES_DB: probe
    command: ["postgres", "-c", "max_connections=20"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probe -d probe"]
      interval: 1s
      timeout: 2s
      retries: 30
    networks: [probe]
  ap:
    build:
      context: .
      dockerfile: tools.Dockerfile
    environment:
      PGPASSWORD: probe-only
    command: ["python3", "/opt/probe/hold-connections.py"]
    depends_on:
      db:
        condition: service_healthy
    networks: [probe]
  netadmin:
    build:
      context: .
      dockerfile: tools.Dockerfile
    command: ["sleep", "infinity"]
    cap_add: [NET_ADMIN]
    network_mode: "service:ap"
    depends_on: [ap]
networks:
  probe:
    internal: true
